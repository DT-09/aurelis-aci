<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aurelis ACI — Live Sandbox</title><link rel="stylesheet" href="/css/app.css"></head><body><header class="topbar"><div class="container row" style="justify-content:space-between;width:100%"><a class="brand" href="/"><span class="au">AU</span><span class="wordmark">AURELIS ACI</span></a><span class="badge">PUBLIC SANDBOX · SYNTHETIC DATA</span></div></header><main class="page"><div class="container"><div class="eyebrow">LIVE CONTROL ENGINE</div><h1 class="serif">Restricted-data transmission</h1><p class="muted" style="max-width:760px">This sandbox executes the same deterministic control logic used by the application. It does not represent a real customer environment.</p><div class="grid grid-2"><section class="panel"><h3>Event context</h3><div class="stack"><label>Data sensitivity<select id="data" class="select"><option>RESTRICTED</option><option>CONFIDENTIAL</option><option>INTERNAL</option></select></label><label>Destination<select id="dest" class="select"><option>EXTERNAL_UNTRUSTED</option><option>EXTERNAL_APPROVED</option><option>INTERNAL</option></select></label><label>Action severity<select id="severity" class="select"><option>CONSEQUENTIAL</option><option>MATERIAL</option></select></label><label>Approval<select id="approval" class="select"><option>NONE</option><option>REQUESTED</option><option>APPROVED</option></select></label><button id="run" class="btn primary">Execute through Aurelis</button></div></section><section class="panel"><div class="eyebrow">CONTROL LINE</div><div id="line" class="control-line"></div><div id="result" class="empty">Awaiting event.</div></section></div></div></main><script type="module" src="/js/demo.mjs"></script></body></html>
